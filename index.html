    // img  = cover image link (empty = colored placeholder)
    // link = where it opens when tapped (empty = nothing happens)
    function makeCover(i) {
      const P = [["#ff1744","#7c3aed"],["#00e5ff","#2962ff"],["#ff9100","#ff1744"],["#00e676","#00b0ff"],["#d500f9","#ff4081"],["#ffd600","#ff6d00"],["#3d5afe","#00e5ff"]];
      const W = ["CREATE","LEARN","GROW","CONNECT","INSPIRE","EXPLORE","SHARE"];
      const S = ["Ideas that move forward","Knowledge made simple","Step by step, every day","Together we go further","Stay motivated, stay curious","Discover something new","Spread the value"];
      const k = i % 7, c1 = P[k][0], c2 = P[k][1];
      const x1 = 140 + (i * 113) % 520, y1 = 90 + (i * 61) % 200;
      const x2 = 640 - (i * 97) % 420, y2 = 330 - (i * 53) % 180;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>
          <linearGradient id="v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0.05"/><stop offset="1" stop-color="#000" stop-opacity="0.6"/></linearGradient>
          <filter id="b"><feGaussianBlur stdDeviation="38"/></filter>
          <pattern id="d" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" fill-opacity="0.2"/></pattern>
        </defs>
        <rect width="800" height="450" fill="url(#g)"/>
        <g filter="url(#b)"><circle cx="${x1}" cy="${y1}" r="130" fill="#fff" fill-opacity="0.3"/><circle cx="${x2}" cy="${y2}" r="120" fill="${c1}" fill-opacity="0.6"/></g>
        <rect x="430" width="370" height="450" fill="url(#d)"/>
        <g fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="2"><circle cx="${x2}" cy="${y2}" r="160"/><circle cx="${x2}" cy="${y2}" r="110"/><circle cx="${x2}" cy="${y2}" r="60"/></g>
        <rect width="800" height="450" fill="url(#v)"/>
        <rect x="56" y="130" width="72" height="6" rx="3" fill="#fff"/>
        <text x="54" y="210" font-family="Arial Black, Arial, sans-serif" font-size="80" font-weight="900" letter-spacing="4" fill="#fff" fill-opacity="0.95">${W[k]}</text>
        <text x="58" y="252" font-family="Arial, sans-serif" font-size="26" fill="#fff" fill-opacity="0.8">${S[k]}</text>
      </svg>`;
      return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }

    const config_slides = [0, 1, 2, 3, 4, 5, 6].map(i => ({ img: makeCover(i), link: "" }));
    const config_slide_seconds = 4; // time between slides
  </script>

  <style>
    :root {
      --a: #ff1744;
      --bg: #07080f;
      --card: #10121c;
      --line: rgba(255, 255, 255, 0.08);
      --txt: #f1f2f8;
      --txm: #8c90ab;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg);
      color: var(--txt);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--a); color: #fff; }

    .wrap {
      position: relative;
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding-bottom: calc(30px + env(safe-area-inset-bottom));
      animation: appear 0.5s ease-out both;
    }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }

    /* light one-time entrance */
    .rise { animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; animation-delay: var(--d, 0s); }
    @keyframes rise { from { opacity: 0; transform: translate3d(0, 16px, 0); } to { opacity: 1; transform: none; } }

    /* ================= COVER SLIDER ================= */
    .cover {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #0c0d15;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }
    .track {
      display: flex;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    .slide { position: relative; flex: 0 0 100%; height: 100%; overflow: hidden; }
    .slide .media { width: 100%; height: 100%; }
    .slide img.media { object-fit: cover; display: block; pointer-events: none; }
    .slide .ph {
      background:
        radial-gradient(circle at 20% 25%, hsl(var(--hue) 85% 55%), transparent 60%),
        radial-gradient(circle at 85% 85%, hsl(calc(var(--hue) + 70) 85% 48%), transparent 60%),
        #0c0d15;
    }
    /* gentle slow zoom on the visible slide */
    .slide.active .media { animation: zoom 7s ease-out forwards; }
    @keyframes zoom { from { transform: scale(1); } to { transform: scale(1.07); } }

    .cover::after {
      content: '';
      position: absolute; left: 0; right: 0; bottom: 0; height: 38%;
      background: linear-gradient(to bottom, transparent, var(--bg));
      pointer-events: none;
    }

    .dots { position: absolute; right: 14px; bottom: 62px; z-index: 3; display: flex; gap: 5px; align-items: center; }

    /* ================= PROFILE ROW ================= */
    .profile { position: relative; z-index: 4; display: flex; align-items: flex-end; gap: 14px; padding: 0 16px; margin-top: -58px; }

    .avatar-wrap { position: relative; flex: none; width: 112px; height: 112px; }
    .avatar-wrap::before { /* soft pulse ring */
      content: '';

    @keyframes pulse { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(1.3); opacity: 0; } }

    .avatar {
      position: relative;

    .info { min-width: 0; padding-bottom: 10px; text-align: left; }
    .name { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(1.15rem, 5.4vw, 1.5rem); letter-spacing: 0.5px; line-height: 1.2; word-break: break-word; }
    .handle { margin-top: 4px; font-family: 'Share Tech Mono', monospace; font-size: 0.95rem; color: #ff5c7c; }

    .tagline { padding: 14px 18px 0; font-size: 1.05rem; font-weight: 500; color: var(--txm); }

    /* ================= LINKS ================= */
    .links-title { display: flex; align-items: center; gap: 12px; padding: 24px 18px 14px; font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; letter-spacing: 3px; color: rgba(255,255,255,0.4); }
    .links-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }

    .links { display: flex; flex-direction: column; gap: 10px; padding: 0 16px; }

    .link {
      --c: #fff;
      display: flex; align-items: center;
      padding: 10px 14px 10px 10px;
      border-radius: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .link { position: relative; }
    .link:active { transform: scale(0.97); }

    /* tap animation: icon pops and a ring spreads out from it */
    .link.tap .icon-box { animation: pop 0.45s cubic-bezier(0.3, 1.5, 0.5, 1); }
    @keyframes pop {
      0%   { transform: scale(1); }
      35%  { transform: scale(0.82) rotate(-6deg); }
      70%  { transform: scale(1.14) rotate(4deg); }
      100% { transform: scale(1); }
    }
    .link::after {
      content: '';
      position: absolute; left: 10px; top: 50%;
      width: 46px; height: 46px; margin-top: -23px;
      border-radius: 14px;
      border: 2px solid var(--c);
      opacity: 0;
      pointer-events: none;
    }
    .link.tap::after { animation: ring 0.55s ease-out; }
    @keyframes ring {
      0%   { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.9); opacity: 0; }
    }
    @media (hover: hover) { .link:hover { border-color: color-mix(in srgb, var(--c) 60%, transparent); transform: translateY(-2px); } }

    .icon-box {
      flex: none; width: 46px; height: 46px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }
    .icon-box svg { width: 100%; height: 100%; display: block; }

    .link-name { flex: 1; padding-left: 14px; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 0.95rem; letter-spacing: 1.2px; }

    .go { flex: none; width: 20px; height: 20px; color: rgba(255,255,255,0.35); transition: transform 0.2s ease, color 0.2s ease; }
    .link:active .go { transform: translateX(3px); color: #fff; }

    .facebook { --c: #1877f2; } .instagram { --c: #e1306c; } .youtube { --c: #ff0000; } .linkedin { --c: #0a66c2; }
    .twitter { --c: #e3e3ec; } .whatsapp { --c: #25d366; } .email { --c: #ea4335; }

    .footer { margin-top: 30px; text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 0.62rem; letter-spacing: 2.5px; color: rgba(255,255,255,0.32); }
    .footer span { color: var(--a); }

    @media (max-width: 360px) {
      .avatar-wrap { width: 96px; height: 96px; }
      .profile { margin-top: -50px; gap: 10px; }
      .link-name { font-size: 0.85rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .rise { opacity: 1; }
    }
  </style>
</head>

  <script>
    const $ = (id) => document.getElementById(id);

    /* ---------- Basic info ---------- */
    const fullName = config_fullname.trim();
    const userName = config_username.trim();
    const pic = config_profile_pic.trim();
    const initialsText = fullName.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();

    $('page-title').textContent = fullName.toUpperCase() + " | Bio Links";
    $('display-fullname-top').textContent = fullName;
    $('display-fullname').textContent = fullName.toUpperCase();
    $('display-username').textContent = userName.startsWith('@') ? userName : '@' + userName;
    $('display-initials').textContent = initialsText;
    $('year').textContent = new Date().getFullYear();

    if (pic) {
      const img = $('display-profile-pic'), tx = $('display-initials');
      img.src = pic; img.hidden = false; tx.hidden = true;
      img.onerror = () => { img.hidden = true; tx.hidden = false; };

      const f = new Image();
      f.crossOrigin = "Anonymous";
      f.onload = function () {
        const c = document.createElement('canvas'); c.width = c.height = 256;
        const ctx = c.getContext('2d'); ctx.beginPath(); ctx.arc(128, 128, 128, 0, Math.PI * 2); ctx.clip();
        ctx.drawImage(f, 0, 0, f.width, f.height, 0, 0, 256, 256);
        try { $('page-favicon').href = c.toDataURL(); } catch (e) { $('page-favicon').href = pic; }
      };
      f.onerror = () => $('page-favicon').href = pic;
      f.src = pic;
    }

    /* ---------- Link tap animation ---------- */
    document.querySelectorAll('.link').forEach(l => {
      l.addEventListener('click', () => {
        l.classList.remove('tap');
        void l.offsetWidth;
        l.classList.add('tap');
        setTimeout(() => l.classList.remove('tap'), 600);
      });
    });

    /* ---------- Cover slider ---------- */
    (function () {
      const slides = (typeof config_slides !== 'undefined' && config_slides.length) ? config_slides : [{ img: '', link: '' }];
      const DUR = (typeof config_slide_seconds !== 'undefined' ? config_slide_seconds : 4) * 1000;
      const track = $('track'), dotsEl = $('dots'), cover = $('cover');
      const n = slides.length;
      let idx = 0, timer = null, sx = 0, down = false, moved = false;
      const els = [];

      slides.forEach((s, i) => {
        const d = document.createElement('div');
        d.className = 'slide';
        if (s.img) {
          const im = new Image();
          im.className = 'media'; im.src = s.img; im.alt = ''; im.draggable = false;
          if (i > 0) im.loading = 'lazy';
          d.appendChild(im);
        } else {
          const ph = document.createElement('div');
          ph.className = 'media ph';
          ph.style.setProperty('--hue', (i * 51 + 345) % 360);
          d.appendChild(ph);
        }
        d.addEventListener('click', () => { if (!moved && s.link) window.open(s.link, '_blank', 'noopener'); });
        track.appendChild(d); els.push(d);

        const dot = document.createElement('span'); dot.className = 'dot'; dotsEl.appendChild(dot);
      });
      if (n < 2) dotsEl.style.display = 'none';

      function show(i) {
        idx = (i + n) % n;
        track.style.transform = `translate3d(${-idx * 100}%, 0, 0)`;
        els.forEach((e, k) => e.classList.toggle('active', k === idx));
        [...dotsEl.children].forEach((d, k) => d.classList.toggle('on', k === idx));
      }
      function start() { stop(); if (n > 1) timer = setInterval(() => show(idx + 1), DUR); }
      function stop() { clearInterval(timer); }

      cover.addEventListener('pointerdown', (e) => { down = true; moved = false; sx = e.clientX; stop(); });
      cover.addEventListener('pointermove', (e) => { if (down && Math.abs(e.clientX - sx) > 10) moved = true; });
      const end = (e) => {
        if (!down) return;
        down = false;
        const dx = e.clientX - sx;
        if (Math.abs(dx) > 40) show(idx + (dx < 0 ? 1 : -1));
        start();
        setTimeout(() => moved = false, 60);
      };
      cover.addEventListener('pointerup', end);
      cover.addEventListener('pointercancel', end);
      cover.addEventListener('pointerleave', end);
      document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

      show(0);
      start();
    })();
  </script>
